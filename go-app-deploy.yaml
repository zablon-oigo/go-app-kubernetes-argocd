---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo-app
  namespace: go-app
  labels:
    app: go-demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-demo-app
  template:
    metadata:
      labels:
        app: go-demo-app
    spec:
      containers:
        - name: go-demo-app
          image: zablondev/go-demo-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
